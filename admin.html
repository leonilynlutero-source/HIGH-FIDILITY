<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin sign in</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="LOGO.png" type="image/png">
</head>
<body data-role="admin">
<main>
  <section id="login">
    <h1>Sign in as Admin</h1>
    <p class="sub">School project demo. Continue to enter your admin details.</p>

    <div class="roles">
      <button class="role" type="button" onclick="location.href='admin.html'">
        <b>Admin</b>
        <small>Manage the system</small>
      </button>
    </div>

    <p class="signup">Not an admin? <a href="user.html?role=user">Sign in as user</a></p>
  </section>
</main>
</body>
</html>
