<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baranagay Complaint and Incident Report System</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="LOGO.png">
</head>
<body data-role="user">
<main>
  <section id="login">
    <a class="back" href="login.html">&larr; Change role</a>
    <h1 id="title">Log in as Admin</h1>
    <p class="sub" id="sub"></p>

    <form id="f" novalidate onsubmit="return false">
      <label class="f">Username
        <input type="text" id="u" autocomplete="username">
      </label>
      <label class="f">Password
        <input type="password" id="p" autocomplete="current-password">
      </label>
      <p class="err" id="err" role="alert"></p>
      <a href="home-admin.html"><button class="go" id="go" type="button">Log in</button></a>
    </form>
    
    </form>

<p class="signup">Don't have an account? <a href="signup.html">Create account</a></p>
  </section>

  <section class="done" id="done" aria-live="polite">
    <h1>Welcome, <span id="name"></span></h1>
    <p>You’re signed in as <span class="tag" id="tag"></span></p>
    <a class="out" href="index.html">Sign out</a>
  </section>
</main>

<script>

  const role = document.body.dataset.role;
  const roleLabel = role.charAt(0).toUpperCase() + role.slice(1);

  document.getElementById("title").textContent = "Sign in as " + roleLabel;
  document.getElementById("tag").textContent = roleLabel;

  const form = document.getElementById("f");
  const err = document.getElementById("err");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    err.textContent = "";

    const username = document.getElementById("u").value.trim();
    const password = document.getElementById("p").value;

    if (!username || !password) {
      err.textContent = "Please enter your username and password.";
      return;
    }

    // TODO: replace with a real server-side login check
    sessionStorage.setItem("user", username);
    sessionStorage.setItem("role", role);
    window.location.href = "home.html";
  });
</script>
</body>
</html>
