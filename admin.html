<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin log in</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="LOGO.png" type="image/png">
</head>
<body data-role="admin">
<main>
  <section id="login">
    <a class="back" href="login.html">&larr; Change role</a>
    <h1 id="title">Log in as Admin</h1>
    <p class="sub" id="sub">School project demo. Use the demo admin account.</p>

    <form id="f" novalidate>
      <label class="f">Email
        <input type="email" id="u" autocomplete="email">
      </label>
      <label class="f">Password
        <input type="password" id="p" autocomplete="current-password">
      </label>
      <p class="err" id="err" role="alert"></p>
      <button class="go" id="go" type="submit">Log in</button>
    </form>
  </section>
</main>

<script src="auth.js"></script>
<script>
  var role = document.body.dataset.role;
  var err = document.getElementById("err");

  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    err.textContent = "";

    var email = document.getElementById("u").value.trim();
    var pass = document.getElementById("p").value;

    if (!email || !pass) {
      err.textContent = "Please enter your email and password.";
      return;
    }

    var msg = Auth.login(email, pass, role);
    if (msg) { err.textContent = msg; return; }

    window.location.href = "home-admin.html";
  });
</script>
</body>
</html>
