<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="LOGO.png" type="image/png">
<style>[hidden]{display:none !important}</style>
</head>
<body data-role="admin">
<main>
  <section id="login">
    <h1>Sign in as Admin</h1>
    <p class="sub">Choose how you’re signing in, then enter your details.</p>
    <form id="f" novalidate>

      <div class="roles">
        <button class="role" type="button" onclick="location.href='admin.html'">
          <b>Admin</b>
          <small>Manage the system</small>
        </button>

        <button class="role" type="button" onclick="location.href='user.html?role=user'">
          <b>User</b>
          <small>Access your account</small>
        </button>
      </div>

      <p class="err" id="err" role="alert"></p>
    </form>
  </section>

  <section class="done" id="done" aria-live="polite" hidden>
    <h1>Welcome, <span id="name"></span></h1>
    <p>You’re signed in as <span class="tag" id="tag"></span></p>
    <p id="dest"></p>
    <button class="out" id="out" type="button">Sign out</button>
  </section>
</main>

<script src="auth.js"></script>
<script>
  // If an admin is already signed in, show the welcome section instead
  var me = (typeof Auth !== "undefined") ? Auth.current() : null;

  if (me && me.role === "admin") {
    document.getElementById("login").hidden = true;
    document.getElementById("done").hidden = false;
    document.getElementById("name").textContent = me.name;
    document.getElementById("tag").textContent = "Admin";
    document.getElementById("dest").innerHTML = '<a href="home-admin.html">Go to the admin home</a>';
  }

  document.getElementById("out").addEventListener("click", function () {
    if (typeof Auth !== "undefined") Auth.logout();
    window.location.href = "admin.html";
  });
</script>
</body>
</html>
