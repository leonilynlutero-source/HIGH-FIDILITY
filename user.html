<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In - Barangay Reporting System</title>

    <!-- CSS CONNECTION -->
   <link rel="stylesheet" href="style.css">
</head>

<body data-role="user">

<main>

    <!-- LOGIN SECTION -->
    <section id="login">

        <a class="back" href="login.html">
            &larr; Change role
        </a>

        <h1 id="title">Sign in as User</h1>

        <p class="sub" id="sub"></p>

        <form id="f" novalidate onsubmit="return false">

            <label class="f">
                Username
                <input
                    type="text"
                    id="u"
                    autocomplete="username"
                    required
                >
            </label>

            <label class="f">
                Password
                <input
                    type="password"
                    id="p"
                    autocomplete="current-password"
                    required
                >
            </label>

            <p class="err" id="err" role="alert"></p>

            <a class="go" id="go" href="home.html">
                Sign in
            </a>

        </form>

        <p class="signup">
            Don't have an account?
            <a href="signup.html">Create account</a>
        </p>

    </section>


    <!-- SUCCESSFUL LOGIN SECTION -->
    <section class="done" id="done" aria-live="polite">

        <h1>
            Welcome, <span id="name"></span>
        </h1>

        <p>
            You're signed in as
            <span class="tag" id="tag"></span>
        </p>

        <a class="out" href="login.html">
            Sign out
        </a>

    </section>

</main>


</body>
</html>
