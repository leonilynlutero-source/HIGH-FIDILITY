<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My profile</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="LOGO.png">
<style>
  /* Hide the input boxes until Edit profile is clicked */
  .profile .edit { display: none; }
  .profile .editing .edit { display: block; }
  .profile .editing .val,
  .profile .editing .view-only { display: none; }
</style>
</head>
<body class="wide profile">
<main>
  <header class="head">
    <div class="who">
      <div class="avatar" id="avatar" aria-hidden="true"></div>
      <div>
        <h1>My profile</h1>
        <p class="sub">Your account information</p>
      </div>
    </div>
    <div>
      <a class="back" href="home.html">&larr; Back to home</a>
      <a class="out" id="signout" href="user.html">Sign out</a>
    </div>
  </header>

  <form id="f" novalidate>
    <div class="grid">

      <div class="f">
        <span class="lbl">First name</span>
        <span class="val" data-view="first"></span>
        <input type="text" id="first" class="edit" autocomplete="given-name" aria-label="First name">
      </div>

      <div class="f">
        <span class="lbl">Last name</span>
        <span class="val" data-view="last"></span>
        <input type="text" id="last" class="edit" autocomplete="family-name" aria-label="Last name">
      </div>

      <div class="f">
        <span class="lbl">Birthdate</span>
        <span class="val" data-view="dob"></span>
        <input type="date" id="dob" class="edit" autocomplete="bday" aria-label="Birthdate">
      </div>

      <div class="f">
        <span class="lbl">Age</span>
        <span class="val" id="age"></span>
        <span class="hint edit">Calculated from your birthdate</span>
      </div>

      <div class="f">
        <span class="lbl">Sex</span>
        <span class="val" data-view="sex"></span>
        <select id="sex" class="edit" aria-label="Sex">
          <option>Female</option>
          <option>Male</option>
          <option>Prefer not to say</option>
        </select>
      </div>

      <div class="f">
        <span class="lbl">Email</span>
        <span class="val" data-view="email"></span>
        <input type="email" id="email" class="edit" autocomplete="email" aria-label="Email">
      </div>

      <div class="f">
        <span class="lbl">Mobile number</span>
        <span class="val" data-view="phone"></span>
        <input type="tel" id="phone" class="edit" autocomplete="tel" placeholder="09XX XXX XXXX" aria-label="Mobile number">
      </div>

      <div class="f">
        <span class="lbl">Street address</span>
        <span class="val" data-view="street"></span>
        <input type="text" id="street" class="edit" autocomplete="street-address" aria-label="Street address">
      </div>

      <div class="f">
        <span class="lbl">Barangay</span>
        <span class="val" data-view="brgy"></span>
        <input type="text" id="brgy" class="edit" aria-label="Barangay">
      </div>

      <div class="f">
        <span class="lbl">City</span>
        <span class="val" data-view="city"></span>
        <input type="text" id="city" class="edit" autocomplete="address-level2" aria-label="City">
      </div>

      <div class="f">
        <span class="lbl">Username</span>
        <span class="val" data-view="username"></span>
        <span class="hint edit">Your username can't be changed</span>
      </div>

      <div class="f">
        <span class="lbl">Password</span>
        <span class="val">••••••••</span>
        <input type="password" id="password" class="edit" autocomplete="new-password"
               placeholder="Leave blank to keep current" aria-label="Password">
      </div>

      <p class="err" id="err" role="alert"></p>
      <p class="ok" id="ok" role="status"></p>

      <div class="actions">
        <button class="go view-only" type="button" id="editBtn">Edit profile</button>
        <button class="go edit" type="submit">Save changes</button>
        <button class="ghost edit" type="button" id="cancelBtn">Cancel</button>
      </div>
    </div>
  </form>
</main>

<script src="auth.js"></script>
<script>
  if (typeof Auth === "undefined") {
    document.querySelector("main").innerHTML =
      "<p>auth.js is missing. Put auth.js in the same folder as this page.</p>";
    throw new Error("auth.js missing");
  }

  // Loads the user account that signed in. Anyone else goes to the user sign in.
  var data = Auth.require("user", "user.html");
  if (!data) { throw new Error("not signed in"); }

  var form = document.getElementById("f");
  var err = document.getElementById("err");
  var ok = document.getElementById("ok");

  var FIELDS = ["first", "last", "dob", "sex", "email", "phone", "street", "brgy", "city"];

  // Older accounts may only have a full name; split it into first/last
  function getFirst(d) {
    if (d.first !== undefined) return d.first;
    var p = String(d.name || "").trim().split(/\s+/);
    return p.length > 1 ? p.slice(0, -1).join(" ") : (p[0] || "");
  }
  function getLast(d) {
    if (d.last !== undefined) return d.last;
    var p = String(d.name || "").trim().split(/\s+/);
    return p.length > 1 ? p[p.length - 1] : "";
  }
  function valueOf(d, k) {
    if (k === "first") return getFirst(d);
    if (k === "last") return getLast(d);
    return d[k] || "";
  }

  function calcAge(dob) {
    if (!dob) return "";
    var b = new Date(dob), t = new Date();
    var age = t.getFullYear() - b.getFullYear();
    var m = t.getMonth() - b.getMonth();
    if (m < 0 || (m === 0 && t.getDate() < b.getDate())) age--;
    return age >= 0 ? age : "";
  }

  function prettyDate(dob) {
    if (!dob) return "";
    return new Date(dob + "T00:00:00").toLocaleDateString("en-US",
      { year: "numeric", month: "long", day: "numeric" });
  }

  function initials(d) {
    return ((getFirst(d)[0] || "") + (getLast(d)[0] || "")).toUpperCase();
  }

  function show() {
    document.querySelectorAll("[data-view]").forEach(function (el) {
      var k = el.getAttribute("data-view");
      el.textContent = k === "dob" ? prettyDate(data.dob) : valueOf(data, k);
    });
    document.getElementById("age").textContent = calcAge(data.dob);
    document.getElementById("avatar").textContent = initials(data);
  }

  function fill() {
    FIELDS.forEach(function (k) {
      document.getElementById(k).value = valueOf(data, k);
    });
    document.getElementById("password").value = "";
    document.getElementById("age").textContent = calcAge(data.dob);
  }

  function setEditing(on) {
    form.classList.toggle("editing", on);
    err.textContent = "";
    if (on) {
      ok.textContent = "";
      fill();
      document.getElementById("first").focus();
    } else {
      show();
    }
  }

  // Live age while editing the birthdate
  document.getElementById("dob").addEventListener("input", function () {
    document.getElementById("age").textContent = calcAge(this.value);
  });

  document.getElementById("editBtn").addEventListener("click", function () { setEditing(true); });
  document.getElementById("cancelBtn").addEventListener("click", function () { setEditing(false); });
  document.getElementById("signout").addEventListener("click", function () { Auth.logout(); });

    e.preventDefault();
    save();
  });
