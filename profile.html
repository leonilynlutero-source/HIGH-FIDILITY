<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My profile</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="LOGO.png" type="image/png">
</head>
<body class="wide profile">
<main>
  <header class="head">
    <div class="who">
      <div class="avatar" id="avatar" aria-hidden="true"></div>
      <div>
        <h1>My profile</h1>
        <p class="sub" id="subtitle">Your account information</p>
      </div>
    </div>
    <div>
      <a class="back" id="backHome" href="home.html">&larr; Back to home</a>
      <a class="out" href="user.html" id="signout">Sign out</a>
    </div>
  </header>

  <form id="f" novalidate>
    <div class="grid">

      <div class="f">
        <span class="lbl">Name</span>
        <span class="val" data-view="name"></span>
        <input type="text" id="name" class="edit" autocomplete="name" aria-label="Name">
      </div>

      <div class="f">
        <span class="lbl">Birthday</span>
        <span class="val" data-view="dob"></span>
        <input type="date" id="dob" class="edit" autocomplete="bday" aria-label="Birthday">
      </div>

      <div class="f">
        <span class="lbl">Age</span>
        <span class="val" id="age"></span>
        <span class="hint edit">Calculated from your birthday</span>
      </div>

      <div class="f">
        <span class="lbl">Sex</span>
        <span class="val" data-view="sex"></span>
        <select id="sex" class="edit" aria-label="Sex">
          <option>Female</option>
          <option>Male</option>
          <option>Prefer not to say</option>
        </select>
      </div>

      <div class="f">
        <span class="lbl">Email</span>
        <span class="val" data-view="email"></span>
        <input type="email" id="email" class="edit" autocomplete="email" aria-label="Email">
      </div>

      <div class="f">
        <span class="lbl">Password</span>
        <span class="val" id="pwview">••••••••</span>
        <input type="password" id="password" class="edit" autocomplete="new-password" aria-label="Password">
      </div>

      <p class="err" id="err" role="alert"></p>
      <p class="ok" id="ok" role="status"></p>

      <div class="actions">
        <button class="go view-only" type="button" id="editBtn">Edit profile</button>
        <button class="go edit" type="submit">Save changes</button>
        <button class="ghost edit" type="button" id="cancelBtn">Cancel</button>
      </div>
    </div>
  </form>
</main>

<script src="auth.js"></script>
<script>
  // Only a signed-in user can open this page; anyone else goes to the user sign in
  var data = Auth.require("user", "user.html");
  if (!data) { throw new Error("not signed in"); }

  var form = document.getElementById("f");
  var err = document.getElementById("err");
  var ok = document.getElementById("ok");

  function calcAge(dob) {
    if (!dob) return "";
    var b = new Date(dob), t = new Date();
    var age = t.getFullYear() - b.getFullYear();
    var m = t.getMonth() - b.getMonth();
    if (m < 0 || (m === 0 && t.getDate() < b.getDate())) age--;
    return age >= 0 ? age : "";
  }

  function prettyDate(dob) {
    if (!dob) return "";
    return new Date(dob + "T00:00:00").toLocaleDateString("en-US",
      { year: "numeric", month: "long", day: "numeric" });
  }

  function initials(name) {
    var parts = String(name || "").trim().split(/\s+/);
    var s = parts[0] ? parts[0][0] : "";
    if (parts.length > 1) s += parts[parts.length - 1][0];
    return s.toUpperCase();
  }

  function show() {
    document.querySelectorAll("[data-view]").forEach(function (el) {
      var k = el.getAttribute("data-view");
      el.textContent = k === "dob" ? prettyDate(data.dob) : (data[k] || "");
    });
    document.getElementById("age").textContent = calcAge(data.dob);
    document.getElementById("avatar").textContent = initials(data.name);
  }

  function fill() {
    ["name", "dob", "sex", "email", "password"].forEach(function (k) {
      document.getElementById(k).value = data[k] || "";
    });
    document.getElementById("age").textContent = calcAge(data.dob);
  }

  function setEditing(on) {
    form.classList.toggle("editing", on);
    err.textContent = "";
    if (on) {
      ok.textContent = "";
      fill();
      document.getElementById("name").focus();
    } else {
      show();
    }
  }

  document.getElementById("dob").addEventListener("input", function () {
    document.getElementById("age").textContent = calcAge(this.value);
  });
  document.getElementById("editBtn").addEventListener("click", function () { setEditing(true); });
  document.getElementById("cancelBtn").addEventListener("click", function () { setEditing(false); });
  document.getElementById("signout").addEventListener("click", function () { Auth.logout(); });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    save();
  });

  function save() {
    var name = document.getElementById("name").value.trim();
    var dob = document.getElementById("dob").value;
    var sex = document.getElementById("sex").value;
    var email = document.getElementById("email").value.trim();
    var pass = document.getElementById("password").value;

    if (name === "" || dob === "" || email === "" || pass === "") {
      err.textContent = "Fill in every field."; return;
    }
    if (new Date(dob) > new Date()) {
      err.textContent = "Birthday cannot be in the future."; return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      err.textContent = "Enter a valid email address."; return;
    }
    if (pass.length < 6) {
      err.textContent = "Use a password with at least 6 characters."; return;
    }

    // Keep the other saved details (mobile, address, username, role...)
    var updated = Object.assign({}, data, {
      name: name, dob: dob, sex: sex, email: email, password: pass
    });

    var msg = Auth.update(updated);
    if (msg) { err.textContent = msg; return; }

    data = Auth.current();
    setEditing(false);
    ok.textContent = "Your profile was updated.";
  }

  show();
</script>
</body>
</html>
