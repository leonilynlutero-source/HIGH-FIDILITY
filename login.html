<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="LOGO.png" type="image/png">
</head>
<body>
<main>
  <section id="login">
    <h1>Sign in</h1>
    <p class="sub">Choose how you’re signing in, then enter your details.</p>

    <div class="roles">
      <button class="role" type="button" onclick="location.href='user.html?role=user'">
        <b>User</b>
        <small>Access your account</small>
      </button>

      <button class="role" type="button" onclick="location.href='admin.html'">
        <b>Admin</b>
        <small>Manage the system</small>
      </button>
    </div>
  </section>
</main>
</body>
</html>
