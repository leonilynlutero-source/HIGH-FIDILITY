<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="LOGO.png" type="image/png">
</head>
<body class="wide" data-role="user">
<main>
  <section id="signup">
    <a class="back" href="user.html">&larr; Back to sign in</a>
    <h1>Create account</h1>
    <p class="sub">Enter your information to create your account. All fields are required.</p>

    <form id="f">

      <h2 class="group">Personal information</h2>
      <div class="row">
        <label class="f">First name
          <input type="text" id="first" autocomplete="given-name" required>
        </label>
        <label class="f">Last name
          <input type="text" id="last" autocomplete="family-name" required>
        </label>
      </div>
      <div class="row">
        <label class="f">Birthdate
          <input type="date" id="dob" autocomplete="bday" required>
        </label>
        <label class="f">Sex
          <select id="sex" required>
            <option value="">Select</option>
            <option>Female</option>
            <option>Male</option>
            <option>Prefer not to say</option>
          </select>
        </label>
      </div>

      <h2 class="group">Contact information</h2>
      <div class="row">
        <label class="f">Email
          <input type="email" id="email" autocomplete="email" required>
        </label>
        <label class="f">Mobile number
          <input type="tel" id="phone" autocomplete="tel" placeholder="09XX XXX XXXX" required>
        </label>
      </div>
      <label class="f">Street address
        <input type="text" id="street" autocomplete="street-address" required>
      </label>
      <div class="row">
        <label class="f">Barangay
          <input type="text" id="brgy" required>
        </label>
        <label class="f">City
          <input type="text" id="city" autocomplete="address-level2" required>
        </label>
      </div>

      <h2 class="group">Account details</h2>
      <label class="f">Username
        <input type="text" id="u" autocomplete="username" required>
      </label>
      <div class="row">
        <label class="f">Password
          <input type="password" id="p" autocomplete="new-password" minlength="6" required>
        </label>
        <label class="f">Confirm password
          <input type="password" id="p2" autocomplete="new-password" minlength="6" required>
        </label>
      </div>

      <p class="err" id="err" role="alert"></p>
      <button class="role" id="go" type="submit">Confirm</button>
    </form>
  </section>
</main>

<script src="auth.js"></script>
<script>
  var err = document.getElementById("err");

  if (typeof Auth === "undefined") {
    err.textContent = "auth.js is missing. Put auth.js in the same folder as this page.";
    document.getElementById("go").disabled = true;
  }

  function val(id) { return document.getElementById(id).value.trim(); }
  function fail(id, message) {
    err.textContent = message;
    document.getElementById(id).focus();
    return false;
  }

  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    err.textContent = "";

    var first = val("first"), last = val("last");
    var dob = document.getElementById("dob").value;
    var sex = document.getElementById("sex").value;
    var email = val("email"), phone = val("phone");
    var street = val("street"), brgy = val("brgy"), city = val("city");
    var username = val("u");
    var pass = document.getElementById("p").value;
    var pass2 = document.getElementById("p2").value;

    if (!first)  return fail("first", "Enter your first name.");
    if (!last)   return fail("last", "Enter your last name.");
    if (!dob)    return fail("dob", "Enter your birthdate.");
    if (new Date(dob) > new Date()) return fail("dob", "Birthdate cannot be in the future.");
    if (!sex)    return fail("sex", "Select your sex.");
    if (!email)  return fail("email", "Enter your email.");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail("email", "Enter a valid email address.");
    if (!phone)  return fail("phone", "Enter your mobile number.");
    if (!/^(09|\+639)\d{9}$/.test(phone.replace(/[\s-]/g, ""))) return fail("phone", "Enter a valid mobile number, like 09XX XXX XXXX.");
    if (!street) return fail("street", "Enter your street address.");
    if (!brgy)   return fail("brgy", "Enter your barangay.");
    if (!city)   return fail("city", "Enter your city.");
    if (!username) return fail("u", "Enter a username.");
    if (username.length < 4 || /\s/.test(username)) return fail("u", "Username needs at least 4 characters and no spaces.");
    if (!pass)   return fail("p", "Enter a password.");
    if (pass.length < 6) return fail("p", "Use a password with at least 6 characters.");
    if (!pass2)  return fail("p2", "Confirm your password.");
    if (pass !== pass2) return fail("p2", "Passwords do not match.");

    var msg = Auth.signup({
      name: first + " " + last,
      first: first, last: last,
      dob: dob, sex: sex,
      email: email, phone: phone,
      street: street, brgy: brgy, city: city,
      username: username,
      password: pass,
      role: "user"
    });
    if (msg) { err.textContent = msg; return; }

    // Account saved: sign the new user in, then go to the user home
    var loginMsg = Auth.login(username, pass, "user");
    if (loginMsg) { err.textContent = loginMsg; return; }

    window.location.href = "home.html";
  });
</script>
</body>
</html>
